# ─────────────────────────────────────────────────────────────
# BeeSearch — Self-hosted Langfuse LLM observability
#
# Runs alongside BeeSearch (does not replace it).
# Langfuse v2 — requires only Postgres, no ClickHouse or Redis.
#
# Quick start:
#   docker compose -f docker-compose.langfuse.yml up -d
#   open http://localhost:3000
#   → create an account → Settings → API Keys
#   → add the keys to your .env file:
#       LANGFUSE_PUBLIC_KEY=pk-lf-...
#       LANGFUSE_SECRET_KEY=sk-lf-...
#       LANGFUSE_HOST=http://localhost:3000
#
# Stop:
#   docker compose -f docker-compose.langfuse.yml down
#
# IMPORTANT: Change NEXTAUTH_SECRET and SALT before exposing to a network.
# ─────────────────────────────────────────────────────────────

services:

  langfuse-db:
    image: postgres:15-alpine
    container_name: beesearch-langfuse-db
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
    volumes:
      - langfuse_db:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5

  langfuse:
    image: langfuse/langfuse:2
    container_name: beesearch-langfuse
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_SECRET: change_me_to_a_32_char_random_string
      SALT: change_me_16chars
      NEXTAUTH_URL: http://localhost:3000
      TELEMETRY_ENABLED: "false"
    depends_on:
      langfuse-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  langfuse_db:
