# ─────────────────────────────────────────────────────────────
# BeeSearch — Docker Compose
#
# Starts two services:
#   ollama — Ollama LLM server (model storage persisted in a volume)
#   web    — React/FastAPI web app at http://localhost:8000
#
# Usage:
#   docker compose up --build          # first run (builds app image)
#   docker compose up                  # subsequent runs
#   docker compose down                # stop and remove containers
#
# Pull a different model:
#   docker compose exec ollama ollama pull mistral-nemo:12b
#
# Run a CLI command inside the running container:
#   docker compose exec web python main.py --check-system
#
# Apple Silicon Mac (M1/M2/M3): the ollama/ollama image runs under
#     x86 emulation and will fail its healthcheck. Install native Ollama
#     (https://ollama.com/download), pull your model, then use:
#   docker compose -f docker-compose.mac.yml up --build
#
# For NVIDIA GPU support:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
# For AMD Radeon GPU + RAM sharing:
#   docker compose -f docker-compose.yml -f docker-compose.gpu-amd.yml up --build
# ─────────────────────────────────────────────────────────────

services:

  # ── Ollama LLM server ───────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: beesearch-ollama
    volumes:
      # Model weights persist across restarts — avoids re-downloading
      - ollama_models:/root/.ollama
    ports:
      # Expose so you can also run `ollama` CLI from the host
      - "11434:11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/version 2>/dev/null || wget -qO- http://localhost:11434/api/version 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s

  # ── Pull the default LLM model on first start ──────────────
  # This service runs once, pulls the model, then exits.
  # If the model is already downloaded, the pull is a no-op.
  model-init:
    image: ollama/ollama:latest
    container_name: beesearch-model-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ollama_models:/root/.ollama
    entrypoint: ["ollama", "pull"]
    command: "${OLLAMA_MODEL:-llama3.2:3b}"
    restart: "no"

  # ── Pull the vision model for figure captioning ─────────────
  # Enables automatic captioning of charts and diagrams in uploaded PDFs.
  # llava:7b (~5 GB) is pulled once; subsequent starts are no-ops.
  # To disable, set VISION_MODEL= in your .env file.
  vision-init:
    image: ollama/ollama:latest
    container_name: beesearch-vision-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ollama_models:/root/.ollama
    entrypoint: ["ollama", "pull"]
    command: "${VISION_MODEL:-llava:7b}"
    restart: "no"

  # ── React/FastAPI web app ───────────────────────────────────
  # Built from the root Dockerfile (multi-stage):
  #   Stage 1: npm ci + npm run build  (React/Vite → frontend/dist/)
  #   Stage 2: pip install -r requirements.txt  (Python + FastAPI)
  # FastAPI serves the built React SPA at "/" via StaticFiles, and all
  # API routes at "/api/*".  No nginx, no separate frontend container.
  # CLI available via `docker compose exec web python main.py ...`.
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beesearch-web
    command: >
      python -m uvicorn backend.app.main:app
      --host 0.0.0.0
      --port 8000
    ports:
      - "${PORT:-8000}:8000"
    environment:
      # Point to the Ollama service by its compose service name
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - NUM_CTX=${NUM_CTX:-32768}
      # Vision model for figure captioning in uploaded PDFs (pulled by vision-init above)
      - VISION_MODEL=${VISION_MODEL:-llava:7b}
      # Optional: Semantic Scholar API key for higher rate limits
      - SEMANTIC_SCHOLAR_API_KEY=${SEMANTIC_SCHOLAR_API_KEY:-}
      - CROSSREF_EMAIL=${CROSSREF_EMAIL:-researcher@example.com}
    volumes:
      # Generated reports and session memory persist on the host
      - ./outputs:/app/outputs
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 120s

# ── Named volumes ───────────────────────────────────────────
volumes:
  # Ollama model weights — stored in Docker-managed volume so they
  # survive `docker compose down` (only removed with --volumes flag)
  ollama_models:
