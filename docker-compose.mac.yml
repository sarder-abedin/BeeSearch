# ─────────────────────────────────────────────────────────────
# Mac standalone Compose file — Apple Silicon (M1/M2/M3)
#
# Uses native Ollama instead of the Docker container.
# The ollama/ollama image runs under x86 emulation on Apple
# Silicon and consistently fails its healthcheck.
#
# Prerequisites:
#   1. Install Ollama: https://ollama.com/download (macOS .dmg)
#   2. ollama pull llama3.2:3b
#   3. ollama pull nomic-embed-text   (for Hybrid RAG)
#   (Ollama starts automatically on login after installation)
#
# Starts three services:
#   app      — Streamlit web UI (http://localhost:8501)
#   backend  — FastAPI REST API for the React frontend (http://localhost:8000)
#   frontend — React web app, served by nginx (http://localhost:5173)
#
# Usage (this file only — do NOT combine with docker-compose.yml):
#   docker compose -f docker-compose.mac.yml up --build
#   docker compose -f docker-compose.mac.yml down --remove-orphans
# ─────────────────────────────────────────────────────────────

services:

  # ── Streamlit web application ────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: research-app
    ports:
      - "${APP_PORT:-8501}:8501"
    environment:
      # Talk to native Ollama running on the Mac host
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - NUM_CTX=${NUM_CTX:-32768}
      - SEMANTIC_SCHOLAR_API_KEY=${SEMANTIC_SCHOLAR_API_KEY:-}
      - CROSSREF_EMAIL=${CROSSREF_EMAIL:-researcher@example.com}
      # Web search uses DuckDuckGo in-process — no separate service needed
      # Keep sessions alive for long LLM/PDF runs (1 hour)
      - STREAMLIT_SERVER_SESSION_IDLE_SECONDS=3600
    volumes:
      # Generated reports and session memory persist on the host
      - ./outputs:/app/outputs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── FastAPI backend (REST API for the React frontend) ───────
  # Reuses the same image as `app` -- requirements.txt already includes
  # fastapi/uvicorn -- just overrides the startup command.
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: research-backend
    command: ["python", "-m", "uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      # Talk to native Ollama running on the Mac host
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - NUM_CTX=${NUM_CTX:-32768}
      - SEMANTIC_SCHOLAR_API_KEY=${SEMANTIC_SCHOLAR_API_KEY:-}
      - CROSSREF_EMAIL=${CROSSREF_EMAIL:-researcher@example.com}
    volumes:
      # Generated reports and session memory persist on the host
      - ./outputs:/app/outputs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── React frontend (static build served by nginx) ───────────
  # /api/* is reverse-proxied to the backend service -- see frontend/nginx.conf.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: research-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
