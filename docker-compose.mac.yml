# ─────────────────────────────────────────────────────────────
# Mac standalone Compose file — Apple Silicon (M1/M2/M3)
#
# Uses native Ollama instead of the Docker container.
# The ollama/ollama image runs under x86 emulation on Apple
# Silicon and consistently fails its healthcheck.
#
# Prerequisites:
#   1. Install Ollama: https://ollama.com/download (macOS .dmg)
#   2. ollama pull llama3.2:3b
#   3. ollama pull nomic-embed-text   (for Hybrid RAG)
#   4. ollama pull llava:7b           (for figure captioning in PDFs)
#   (Ollama starts automatically on login after installation)
#
# Starts one service:
#   web — React/FastAPI web app at http://localhost:8000.
#
# Usage (this file only — do NOT combine with docker-compose.yml):
#   docker compose -f docker-compose.mac.yml up --build
#   docker compose -f docker-compose.mac.yml down --remove-orphans
# ─────────────────────────────────────────────────────────────

services:

  # ── React/FastAPI web app ───────────────────────────────────
  # Built from the root Dockerfile (multi-stage):
  #   Stage 1: npm ci + npm run build  (React/Vite → frontend/dist/)
  #   Stage 2: pip install -r requirements.txt  (Python + FastAPI)
  # FastAPI serves the built React SPA at "/" via StaticFiles, and all
  # API routes at "/api/*".
  # CLI: `docker compose -f docker-compose.mac.yml exec web python main.py ...`
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beesearch-web
    command: >
      python -m uvicorn backend.app.main:app
      --host 0.0.0.0
      --port 8000
    ports:
      - "${PORT:-8000}:8000"
    environment:
      # Talk to native Ollama running on the Mac host
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - NUM_CTX=${NUM_CTX:-32768}
      # Vision model for figure captioning — pull with: ollama pull llava:7b
      - VISION_MODEL=${VISION_MODEL:-llava:7b}
      - SEMANTIC_SCHOLAR_API_KEY=${SEMANTIC_SCHOLAR_API_KEY:-}
      - CROSSREF_EMAIL=${CROSSREF_EMAIL:-researcher@example.com}
    volumes:
      # Generated reports and session memory persist on the host
      - ./outputs:/app/outputs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 120s
